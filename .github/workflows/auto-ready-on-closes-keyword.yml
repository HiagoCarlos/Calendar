name: Auto ready-for-review on closing keyword

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready for review if body references a closing keyword
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr.draft) {
              core.info('PR is not a draft, nothing to do.');
              return;
            }

            const body = pr.body || '';
            const closesPattern = /\b(close|closes|closed|fix|fixes|fixed|resolved)\s+#\d+/i;

            if (!closesPattern.test(body)) {
              core.info('No closing keyword found in PR body, leaving as draft.');
              return;
            }

            await github.graphql(
              `mutation($id: ID!) {
                markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                  pullRequest { id isDraft }
                }
              }`,
              { id: pr.node_id }
            );

            core.info(`PR #${pr.number} marked ready for review.`);
