name: CI - Frontend

on:
  push:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Verifica a formatação do código.
      # Caso o ESLint seja adicionado futuramente, pode ser executado separadamente.
      - name: Check formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Unit tests
        run: npm test

      - name: Production build (SSR)
        run: npm run build