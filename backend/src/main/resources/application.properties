spring.application.name=calendar

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:-calendar}
spring.datasource.username=${POSTGRES_USER:-calendar}
spring.datasource.password=${POSTGRES_PASSWORD:-calendar}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-0123456789abcdef}
jwt.expiration-ms=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
