name: CI - Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # There is no .eslintrc in the project yet — using prettier as a formatting check.
      # If ESLint is added later, replace this step with `npx eslint .`.
      - name: Check formatting (prettier)
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Unit tests
        run: npm test

      - name: Production build (SSR)
        run: npm run build